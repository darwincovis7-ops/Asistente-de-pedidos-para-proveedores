<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1F6F5C"><title>Pedidos a Proveedores</title><style>body{margin:0;background:#f6f1e7;color:#211c14;font-family:Arial,sans-serif}#app{max-width:560px;margin:auto;padding:20px}input,button{font:inherit}input{width:100%;padding:13px;border:1px solid #e3d9c4;border-radius:12px;box-sizing:border-box;margin:6px 0 12px}button{padding:13px;border:0;border-radius:12px;font-weight:700;cursor:pointer}.primary{background:#1f6f5c;color:#fff;width:100%}.secondary{background:#fff;border:1px solid #e3d9c4}.view{display:none}.active{display:block}.card{background:#fff;border:1px solid #e3d9c4;border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.muted{color:#7a7060}.danger{background:#b23a2e;color:#fff}.hidden{display:none!important}.product{display:flex;align-items:center;gap:8px;border:1px solid #e3d9c4;border-radius:14px;padding:10px;margin:8px 0;background:#fff}.step button{padding:8px 12px}.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 40px));background:#1f6f5c;color:#fff;border-radius:30px}.status{text-align:center;font-size:12px;padding:7px}.ok{color:#1f6f5c}.err{color:#b23a2e}</style></head><body><div id="app"><header class="row"><button id="back" class="secondary hidden">←</button><h2 id="title" class="grow">Pedidos a Proveedores</h2><button id="logout" class="secondary hidden">🚪</button></header><div id="status" class="status"></div><section id="login" class="view active"><p class="muted">Crea una cuenta o inicia sesión.</p><input id="email" type="email" placeholder="Correo electrónico"><input id="password" type="password" placeholder="Contraseña"><button id="auth" class="primary">Crear cuenta</button><button id="switch" class="secondary" style="width:100%;margin-top:8px">Ya tengo una cuenta</button><p id="msg" class="muted"></p></section><section id="suppliers" class="view"><p class="muted">Elige un proveedor para preparar el pedido.</p><input id="supplierSearch" placeholder="🔍 Buscar proveedor..."><div id="supplierList"></div><p id="supplierEmpty" class="muted hidden">Todavía no hay proveedores.</p></section><section id="form" class="view"><div class="card"><label>Nombre del proveedor</label><input id="supplierName" placeholder="Ej: Distribuidora Norte"><label>WhatsApp</label><input id="supplierPhone" placeholder="573001234567"><button id="saveSupplier" class="primary">Guardar proveedor</button><button id="deleteSupplier" class="danger hidden" style="width:100%;margin-top:8px">Eliminar proveedor</button></div></section><section id="order" class="view"><div class="card"><input id="newProduct" placeholder="Nombre del producto"><button id="addProduct" class="primary">+ Agregar producto</button></div><input id="productSearch" placeholder="🔍 Buscar producto..."><div id="productList"></div><p id="productEmpty" class="muted hidden">No hay productos.</p></section><button id="addSupplier" class="fab hidden">+ Nuevo proveedor</button><button id="send" class="fab hidden">📲 Enviar por WhatsApp</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://uiifvaovrnjejuljnkrh.supabase.co',KEY='sb_publishable_6rhG4vKZDHw6YRXUkwoU8w_CaOsutAi',sb=supabase.createClient(URL,KEY);let session,business,suppliers=[],products=[],active,editing,cart={},signup=true;const $=x=>document.getElementById(x);function view(id,title){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');$('title').textContent=title;$('back').classList.toggle('hidden',id==='login'||id==='suppliers');$('logout').classList.toggle('hidden',id==='login');$('addSupplier').classList.toggle('hidden',id!=='suppliers');$('send').classList.toggle('hidden',id!=='order')}function status(t,err=false){$('status').textContent=t;$('status').className='status '+(err?'err':'ok')}function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}async function load(){let b=await sb.from('businesses').select('*').eq('owner_id',session.user.id).maybeSingle();if(b.error)throw b.error;if(!b.data){let n=session.user.user_metadata?.business_name||session.user.email.split('@')[0];let x=await sb.from('businesses').insert({owner_id:session.user.id,name:n}).select().single();if(x.error)throw x.error;business=x.data}else business=b.data;let s=await sb.from('suppliers').select('*').eq('business_id',business.id).order('name');if(s.error)throw s.error;suppliers=s.data||[];products=[];if(suppliers.length){let p=await sb.from('products').select('*').in('supplier_id',suppliers.map(x=>x.id)).order('name');if(p.error)throw p.error;products=p.data||[]}}function renderSuppliers(){let q=$('supplierSearch').value.toLowerCase(),a=suppliers.filter(s=>s.name.toLowerCase().includes(q));$('supplierList').innerHTML=a.map(s=>`<div class="card row" onclick="openOrder('${s.id}')"><b class="grow">${esc(s.name)}<br><small class="muted">${products.filter(p=>p.supplier_id===s.id).length} productos</small></b><button class="secondary" onclick="event.stopPropagation();editSupplier('${s.id}')">Editar</button></div>`).join('');$('supplierEmpty').classList.toggle('hidden',a.length>0)}function renderProducts(){let s=suppliers.find(x=>x.id===active),q=$('productSearch').value.toLowerCase(),a=products.filter(p=>p.supplier_id===s.id&&p.name.toLowerCase().includes(q));$('productList').innerHTML=a.map(p=>{let n=cart[p.id]||0;return `<div class="product"><span class="grow">${esc(p.name)}</span><div class="step"><button onclick="qty('${p.id}',${Math.max(0,n-1)})">−</button><b>${n}</b><button onclick="qty('${p.id}',${n+1})">+</button></div><button onclick="delProduct('${p.id}')">🗑️</button></div>`}).join('');$('productEmpty').classList.toggle('hidden',a.length>0)}$('switch').onclick=()=>{signup=!signup;$('auth').textContent=signup?'Crear cuenta':'Iniciar sesión';$('switch').textContent=signup?'Ya tengo una cuenta':'Crear una cuenta'};$('auth').onclick=async()=>{try{let email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)throw Error('Correo y contraseña (mínimo 6 caracteres).');let r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data.session){$('msg').textContent='Revisa tu correo para confirmar la cuenta.';return}session=r.data.session;await load();status('☁️ Sincronizado');view('suppliers','Mis Proveedores');renderSuppliers()}catch(e){$('msg').textContent=e.message}};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('addSupplier').onclick=()=>{editing=null;$('supplierName').value='';$('supplierPhone').value='';$('deleteSupplier').classList.add('hidden');view('form','Nuevo proveedor')};window.editSupplier=id=>{editing=suppliers.find(s=>s.id===id);$('supplierName').value=editing.name;$('supplierPhone').value=editing.whatsapp||editing.phone||'';$('deleteSupplier').classList.remove('hidden');view('form','Editar proveedor')};$('saveSupplier').onclick=async()=>{let name=$('supplierName').value.trim(),whatsapp=$('supplierPhone').value.trim();if(!name||!whatsapp)return alert('Completa nombre y WhatsApp.');let r=editing?await sb.from('suppliers').update({name,whatsapp}).eq('id',editing.id):await sb.from('suppliers').insert({business_id:business.id,name,whatsapp});if(r.error)return alert(r.error.message);await load();renderSuppliers();view('suppliers','Mis Proveedores')};$('deleteSupplier').onclick=async()=>{if(!confirm('¿Eliminar proveedor y sus productos?'))return;let r=await sb.from('suppliers').delete().eq('id',editing.id);if(r.error)return alert(r.error.message);await load();renderSuppliers();view('suppliers','Mis Proveedores')};window.openOrder=id=>{active=id;cart={};$('productSearch').value='';view('order',suppliers.find(s=>s.id===id).name);renderProducts()};window.qty=(id,n)=>{if(n)cart[id]=n;else delete cart[id];renderProducts()};$('addProduct').onclick=async()=>{let name=$('newProduct').value.trim();if(!name)return;let r=await sb.from('products').insert({supplier_id:active,name});if(r.error)return alert(r.error.message);$('newProduct').value='';await load();renderProducts()};window.delProduct=async id=>{if(!confirm('¿Eliminar producto?'))return;let r=await sb.from('products').delete().eq('id',id);if(r.error)return alert(r.error.message);delete cart[id];await load();renderProducts()};$('send').onclick=async()=>{let s=suppliers.find(x=>x.id===active),items=products.filter(p=>p.supplier_id===active&&cart[p.id]>0);if(!items.length)return alert('Agrega cantidades primero.');let o=await sb.from('orders').insert({business_id:business.id,supplier_id:s.id}).select().single();if(o.error)return alert(o.error.message);let rows=items.map(p=>({order_id:o.data.id,product_id:p.id,product_name:p.name,quantity:cart[p.id]})),ir=await sb.from('order_items').insert(rows);if(ir.error)return alert(ir.error.message);let txt='Hola, te envío este pedido:\n\n'+items.map(p=>`• ${cart[p.id]} ${p.name}`).join('\n'),phone=(s.whatsapp||s.phone||'').replace(/\D/g,'');window.open(phone?`https://wa.me/${phone}?text=${encodeURIComponent(txt)}`:`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank');cart={};renderProducts()};$('back').onclick=()=>view('suppliers','Mis Proveedores');$('supplierSearch').oninput=renderSuppliers;$('productSearch').oninput=renderProducts;sb.auth.getSession().then(async r=>{if(r.data.session){session=r.data.session;try{await load();view('suppliers','Mis Proveedores');renderSuppliers()}catch(e){status(e.message,true)}}});
</script></body></html>
