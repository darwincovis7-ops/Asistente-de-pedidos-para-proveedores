<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pedidos a Proveedores</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937}header{background:#1f4e79;color:#fff;padding:18px;text-align:center}main{max-width:900px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}h1,h2,h3{margin-top:0}input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #cbd5e1;font-size:16px}button{background:#1f4e79;color:#fff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#64748b}button.danger{background:#b91c1c}button:disabled{opacity:.6;cursor:not-allowed}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin:8px 0}.hidden{display:none}.muted{color:#64748b;font-size:14px}.status{padding:10px;border-radius:9px;margin:10px 0;background:#e2e8f0;white-space:pre-wrap}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.warning{background:#fef3c7;color:#92400e}.qty{width:90px;display:inline-block;margin-right:8px}.topbar{display:flex;gap:8px;align-items:center;justify-content:space-between}.topbar button{width:auto;margin:0;padding:9px 14px}.small{font-size:13px}@media(max-width:600px){.row{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.topbar button{width:100%}}
</style>
</head>
<body>
<header><h1>Pedidos a Proveedores</h1><div class="small">Gestiona proveedores, productos y pedidos desde tu celular</div></header>
<main>
<div id="globalStatus" class="status">Iniciando aplicación...</div>

<section id="authCard" class="card">
<h2>Iniciar sesión</h2>
<p class="muted">Usa tu correo y contraseña. Si no tienes cuenta, puedes crearla aquí.</p>
<label>Correo electrónico</label>
<input id="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com">
<label>Contraseña</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres">
<div class="row">
<button id="loginBtn">Iniciar sesión</button>
<button id="signupBtn" class="secondary">Crear cuenta</button>
</div>
<button id="testBtn" class="secondary">Probar conexión con Supabase</button>
<div id="authStatus" class="status hidden"></div>
</section>

<section id="appCard" class="hidden">
<div class="card">
<div class="topbar"><div><h2 id="businessTitle">Mi negocio</h2><div id="userInfo" class="muted"></div></div><button id="logoutBtn" class="secondary">Cerrar sesión</button></div>
</div>

<div class="card">
<h2>Proveedor</h2>
<div class="row"><input id="supplierName" placeholder="Nombre del proveedor"><input id="supplierWhatsapp" placeholder="WhatsApp, ej. 573001234567"></div>
<button id="addSupplierBtn">Agregar proveedor</button>
<div id="suppliersList"></div>
</div>

<div class="card">
<h2>Producto</h2>
<select id="productSupplier"><option value="">Selecciona proveedor</option></select>
<input id="productName" placeholder="Nombre del producto">
<button id="addProductBtn">Agregar producto</button>
<div id="productsList"></div>
</div>

<div class="card">
<h2>Crear pedido</h2>
<select id="orderSupplier"><option value="">Selecciona proveedor</option></select>
<div id="orderProducts"></div>
<button id="createOrderBtn">Crear pedido y preparar WhatsApp</button>
<div id="orderStatus" class="status hidden"></div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';

  var SUPABASE_URL = 'https://uiifvaovrnjejuljnkrh.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_6rhG4vKZDHw6YRXUkwoU8w_CaOsutAi';
  var sb = null;
  var session = null;
  var business = null;
  var suppliers = [];
  var products = [];

  function $(id){ return document.getElementById(id); }
  function show(el,msg,type){
    if(!el)return;
    el.textContent=msg||'';
    el.className='status'+(type?' '+type:'');
    el.classList.remove('hidden');
  }
  function hide(el){ if(el)el.classList.add('hidden'); }
  function global(msg,type){ show($('globalStatus'),msg,type); }
  function authMsg(msg,type){ show($('authStatus'),msg,type); }
  function orderMsg(msg,type){ show($('orderStatus'),msg,type); }
  function errText(error){
    if(!error)return 'Error desconocido.';
    return (error.message||error.error_description||error.msg||String(error));
  }
  function normalizePhone(v){ return String(v||'').replace(/[^0-9]/g,''); }
  function escapeHtml(v){
    return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});
  }

  function init(){
    if(!window.supabase || !window.supabase.createClient){
      global('No se pudo cargar Supabase desde el CDN. Revisa tu conexión a Internet y vuelve a cargar la página.','error');
      $('loginBtn').disabled=true;$('signupBtn').disabled=true;
      return;
    }
    try{
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      global('Supabase cargado correctamente. Puedes iniciar sesión o crear una cuenta.','success');
      bindEvents();
      restoreSession();
    }catch(e){
      global('Error al iniciar Supabase: '+errText(e),'error');
    }
  }

  function bindEvents(){
    $('signupBtn').addEventListener('click',signup);
    $('loginBtn').addEventListener('click',login);
    $('testBtn').addEventListener('click',testConnection);
    $('logoutBtn').addEventListener('click',logout);
    $('addSupplierBtn').addEventListener('click',addSupplier);
    $('addProductBtn').addEventListener('click',addProduct);
    $('productSupplier').addEventListener('change',renderProducts);
    $('orderSupplier').addEventListener('change',renderOrderProducts);
    $('createOrderBtn').addEventListener('click',createOrder);
  }

  async function restoreSession(){
    try{
      var r=await sb.auth.getSession();
      if(r.error){global('No se pudo comprobar la sesión: '+errText(r.error),'error');return;}
      if(r.data && r.data.session){
        session=r.data.session;
        await enterApp();
      }else{
        showAuth();
      }
    }catch(e){global('Error comprobando sesión: '+errText(e),'error');}
    sb.auth.onAuthStateChange(function(event,newSession){
      session=newSession;
      if(newSession && event==='SIGNED_IN') enterApp();
      if(!newSession && event==='SIGNED_OUT') showAuth();
    });
  }

  function showAuth(){
    $('authCard').classList.remove('hidden');
    $('appCard').classList.add('hidden');
  }
  function showApp(){
    $('authCard').classList.add('hidden');
    $('appCard').classList.remove('hidden');
  }

  async function signup(){
    var email=$('email').value.trim();
    var password=$('password').value;
    if(!email || !password){authMsg('Escribe el correo y la contraseña.','warning');return;}
    if(password.length<6){authMsg('La contraseña debe tener al menos 6 caracteres.','warning');return;}
    var btn=$('signupBtn');btn.disabled=true;btn.textContent='Creando cuenta...';
    authMsg('Conectando con Supabase...');
    try{
      var r=await sb.auth.signUp({email:email,password:password});
      if(r.error){authMsg('Supabase rechazó la creación de la cuenta:\n'+errText(r.error),'error');return;}
      if(r.data && r.data.session){
        authMsg('Cuenta creada correctamente. Entrando...','success');
        session=r.data.session;
        await enterApp();
      }else{
        authMsg('La cuenta fue creada, pero Supabase requiere confirmar el correo. Revisa tu bandeja de entrada y luego inicia sesión.','success');
      }
    }catch(e){authMsg('Error inesperado al crear la cuenta:\n'+errText(e),'error');}
    finally{btn.disabled=false;btn.textContent='Crear cuenta';}
  }

  async function login(){
    var email=$('email').value.trim();
    var password=$('password').value;
    if(!email || !password){authMsg('Escribe el correo y la contraseña.','warning');return;}
    var btn=$('loginBtn');btn.disabled=true;btn.textContent='Entrando...';
    authMsg('Iniciando sesión...');
    try{
      var r=await sb.auth.signInWithPassword({email:email,password:password});
      if(r.error){authMsg('No se pudo iniciar sesión:\n'+errText(r.error),'error');return;}
      session=r.data.session;
      authMsg('Sesión iniciada.','success');
      await enterApp();
    }catch(e){authMsg('Error inesperado al iniciar sesión:\n'+errText(e),'error');}
    finally{btn.disabled=false;btn.textContent='Iniciar sesión';}
  }

  async function testConnection(){
    if(!sb){authMsg('Supabase todavía no está cargado.','error');return;}
    var btn=$('testBtn');btn.disabled=true;btn.textContent='Probando...';
    try{
      var r=await sb.auth.getSession();
      if(r.error) authMsg('Conexión recibida, pero Supabase respondió con error:\n'+errText(r.error),'error');
      else authMsg('Conexión con Supabase funcionando correctamente.\nEl proyecto responde y la librería está activa.','success');
    }catch(e){authMsg('No se pudo contactar Supabase:\n'+errText(e),'error');}
    finally{btn.disabled=false;btn.textContent='Probar conexión con Supabase';}
  }

  async function logout(){
    try{await sb.auth.signOut();}catch(e){global('Error cerrando sesión: '+errText(e),'error');}
  }

  async function enterApp(){
    if(!session || !session.user){showAuth();return;}
    showApp();
    $('userInfo').textContent='Usuario: '+session.user.email;
    global('Sesión activa. Cargando datos...','success');
    await ensureBusiness();
    await loadData();
  }

  async function ensureBusiness(){
    try{
      var r=await sb.from('businesses').select('*').eq('owner_id',session.user.id).limit(1);
      if(r.error){
        global('La cuenta funciona, pero no pude consultar la tabla businesses.\n'+errText(r.error)+'\n\nRevisa las políticas RLS y las columnas de esa tabla.','error');
        return;
      }
      if(r.data && r.data.length){business=r.data[0];$('businessTitle').textContent=business.name||'Mi negocio';return;}
      var ins=await sb.from('businesses').insert({owner_id:session.user.id,name:'Mi negocio'}).select().single();
      if(ins.error){
        global('La cuenta funciona, pero no pude crear tu negocio en businesses.\n'+errText(ins.error)+'\n\nLa autenticación ya está funcionando; este es un problema separado de la tabla businesses/RLS.','error');
        return;
      }
      business=ins.data;
      $('businessTitle').textContent=business.name||'Mi negocio';
    }catch(e){global('Error con businesses: '+errText(e),'error');}
  }

  async function loadData(){
    if(!business || !business.id){
      renderAll();return;
    }
    try{
      var s=await sb.from('suppliers').select('*').eq('business_id',business.id).order('name');
      if(s.error){global('Error cargando proveedores:\n'+errText(s.error),'error');return;}
      suppliers=s.data||[];
      var p=await sb.from('products').select('*').eq('business_id',business.id).order('name');
      if(p.error){global('Error cargando productos:\n'+errText(p.error),'error');return;}
      products=p.data||[];
      renderAll();
      global('Datos cargados correctamente.','success');
    }catch(e){global('Error cargando datos: '+errText(e),'error');}
  }

  function renderAll(){
    renderSuppliers();renderSupplierSelects();renderProducts();renderOrderProducts();
  }

  function renderSuppliers(){
    var el=$('suppliersList');
    if(!suppliers.length){el.innerHTML='<p class="muted">Todavía no tienes proveedores.</p>';return;}
    el.innerHTML=suppliers.map(function(s){return '<div class="item"><b>'+escapeHtml(s.name)+'</b><br><span class="muted">WhatsApp: '+escapeHtml(s.whatsapp||'No registrado')+'</span></div>';}).join('');
  }

  function renderSupplierSelects(){
    var options='<option value="">Selecciona proveedor</option>'+suppliers.map(function(s){return '<option value="'+escapeHtml(s.id)+'">'+escapeHtml(s.name)+'</option>';}).join('');
    $('productSupplier').innerHTML=options;
    $('orderSupplier').innerHTML=options;
  }

  function renderProducts(){
    var selected=$('productSupplier').value;
    var list=selected?products.filter(function(p){return String(p.supplier_id)===String(selected);}):products;
    var el=$('productsList');
    if(!list.length){el.innerHTML='<p class="muted">No hay productos para mostrar.</p>';return;}
    el.innerHTML=list.map(function(p){return '<div class="item"><b>'+escapeHtml(p.name)+'</b><br><span class="muted">Proveedor: '+escapeHtml((suppliers.find(function(s){return String(s.id)===String(p.supplier_id);})||{}).name||'')+'</span></div>';}).join('');
  }

  function renderOrderProducts(){
    var supplierId=$('orderSupplier').value;
    var el=$('orderProducts');
    if(!supplierId){el.innerHTML='<p class="muted">Selecciona un proveedor para ver sus productos.</p>';return;}
    var list=products.filter(function(p){return String(p.supplier_id)===String(supplierId);});
    if(!list.length){el.innerHTML='<p class="muted">Este proveedor no tiene productos.</p>';return;}
    el.innerHTML=list.map(function(p){return '<div class="item"><b>'+escapeHtml(p.name)+'</b><br><input class="qty" type="number" min="0" step="1" value="0" data-product-id="'+escapeHtml(p.id)+'"> cantidad</div>';}).join('');
  }

  async function addSupplier(){
    if(!business){global('Primero debe estar creada la información del negocio.','warning');return;}
    var name=$('supplierName').value.trim();
    var whatsapp=normalizePhone($('supplierWhatsapp').value);
    if(!name){global('Escribe el nombre del proveedor.','warning');return;}
    var btn=$('addSupplierBtn');btn.disabled=true;
    try{
      var r=await sb.from('suppliers').insert({business_id:business.id,name:name,whatsapp:whatsapp}).select().single();
      if(r.error){global('No se pudo guardar el proveedor:\n'+errText(r.error),'error');return;}
      suppliers.push(r.data);$('supplierName').value='';$('supplierWhatsapp').value='';renderAll();global('Proveedor agregado.','success');
    }catch(e){global('Error agregando proveedor: '+errText(e),'error');}
    finally{btn.disabled=false;}
  }

  async function addProduct(){
    if(!business){global('Primero debe estar creada la información del negocio.','warning');return;}
    var supplierId=$('productSupplier').value;
    var name=$('productName').value.trim();
    if(!supplierId || !name){global('Selecciona proveedor y escribe el nombre del producto.','warning');return;}
    var btn=$('addProductBtn');btn.disabled=true;
    try{
      var r=await sb.from('products').insert({business_id:business.id,supplier_id:supplierId,name:name}).select().single();
      if(r.error){global('No se pudo guardar el producto:\n'+errText(r.error),'error');return;}
      products.push(r.data);$('productName').value='';renderAll();global('Producto agregado.','success');
    }catch(e){global('Error agregando producto: '+errText(e),'error');}
    finally{btn.disabled=false;}
  }

  async function createOrder(){
    if(!business){orderMsg('No hay negocio activo.','error');return;}
    var supplierId=$('orderSupplier').value;
    if(!supplierId){orderMsg('Selecciona un proveedor.','warning');return;}
    var inputs=document.querySelectorAll('#orderProducts input[data-product-id]');
    var items=[];
    inputs.forEach(function(input){
      var q=parseInt(input.value,10)||0;
      if(q>0){
        var p=products.find(function(x){return String(x.id)===String(input.getAttribute('data-product-id'));});
        if(p)items.push({product:p,quantity:q});
      }
    });
    if(!items.length){orderMsg('Todos los productos están en 0. Solo se envían productos con cantidad mayor que 0.','warning');return;}
    var supplier=suppliers.find(function(s){return String(s.id)===String(supplierId);});
    var btn=$('createOrderBtn');btn.disabled=true;btn.textContent='Guardando pedido...';
    try{
      var o=await sb.from('orders').insert({business_id:business.id,supplier_id:supplierId}).select().single();
      if(o.error){orderMsg('No se pudo crear el pedido:\n'+errText(o.error),'error');return;}
      var rows=items.map(function(i){return {order_id:o.data.id,product_id:i.product.id,product_name:i.product.name,quantity:i.quantity};});
      var oi=await sb.from('order_items').insert(rows);
      if(oi.error){orderMsg('El pedido fue creado, pero falló el detalle:\n'+errText(oi.error),'error');return;}
      var lines=['Pedido de productos',''];
      items.forEach(function(i){lines.push(i.quantity+' x '+i.product.name);});
      var phone=normalizePhone(supplier && supplier.whatsapp);
      var textMsg=encodeURIComponent(lines.join('\n'));
      var url=phone?'https://wa.me/'+phone+'?text='+textMsg:'https://wa.me/?text='+textMsg;
      orderMsg('Pedido guardado correctamente. Se abrirá WhatsApp con solo los productos cuya cantidad es mayor que 0.','success');
      window.open(url,'_blank');
      inputs.forEach(function(input){input.value='0';});
    }catch(e){orderMsg('Error creando pedido:\n'+errText(e),'error');}
    finally{btn.disabled=false;btn.textContent='Crear pedido y preparar WhatsApp';}
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
</body>
</html>
